<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic Island Radio</title>
  <desc id="desc">A futuristic radio app icon with a Dynamic Island pill, radio symbol, audio equalizer, and cyan-to-magenta neon gradients.</desc>
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12D8FA"/>
      <stop offset="48%" stop-color="#5965FF"/>
      <stop offset="100%" stop-color="#F725D4"/>
    </linearGradient>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#050711"/>
      <stop offset="100%" stop-color="#16091F"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#background)"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="url(#neon)" stroke-width="4" opacity=".95" filter="url(#glow)"/>
  <rect x="31" y="31" width="450" height="450" rx="94" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5"/>

  <!-- Broadcast waves -->
  <g fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
    <path d="M177 151 A112 112 0 0 1 335 151"/>
    <path d="M202 176 A77 77 0 0 1 310 176"/>
    <path d="M202 336 A77 77 0 0 0 310 336"/>
    <path d="M177 361 A112 112 0 0 0 335 361"/>
  </g>

  <!-- Dynamic Island capsule -->
  <rect x="91" y="193" width="330" height="126" rx="63" fill="#03050B" stroke="url(#neon)" stroke-width="4"/>
  <rect x="100" y="202" width="312" height="108" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5"/>

  <!-- Minimal radio -->
  <g stroke="#F8FAFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 232 L176 213" stroke-width="4" fill="none"/>
    <circle cx="179" cy="212" r="4.5" fill="#F8FAFF" stroke="none"/>
    <rect x="117" y="232" width="66" height="49" rx="8" fill="#F8FAFF" stroke="none"/>
    <rect x="124" y="239" width="52" height="9" rx="2" fill="#0A0D18" stroke="none"/>
    <path d="M126 258 H148 M126 267 H148 M126 276 H148" stroke="#0A0D18" stroke-width="4"/>
    <circle cx="165" cy="265" r="8" fill="none" stroke="#0A0D18" stroke-width="4"/>
  </g>

  <!-- Equalizer bars -->
  <g stroke="#F8FAFF" stroke-width="6" stroke-linecap="round">
    <path d="M207 251 V261"/>
    <path d="M224 242 V270"/>
    <path d="M241 231 V281"/>
    <path d="M258 220 V292"/>
    <path d="M275 231 V281"/>
    <path d="M292 242 V270"/>
    <path d="M309 251 V261"/>
  </g>
  <circle cx="370" cy="256" r="12" fill="url(#neon)" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="256" y="408" fill="#F8FAFF" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="1.2" text-anchor="middle">DYNAMIC ISLAND</text>
  <path d="M100 435 H166 M346 435 H412" stroke="url(#neon)" stroke-width="4" stroke-linecap="round"/>
  <text x="256" y="447" fill="url(#neon)" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="7" text-anchor="middle">RADIO</text>
</svg>
